services:
  mysql:
    image: mysql:8.0
    container_name: cinema_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: moviereviewdbupdated
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: cinema_redis
    command: redis-server --requirepass redispass --notify-keyspace-events Ex
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  minio:
    build:
      context: .
      dockerfile_inline: |
        FROM golang:alpine AS builder
        RUN apk add --no-cache git
        RUN go install github.com/minio/minio@latest

        FROM alpine:3.19
        RUN apk add --no-cache ca-certificates
        COPY --from=builder /go/bin/minio /usr/bin/minio
        RUN mkdir -p /data
        EXPOSE 9000
        EXPOSE 9001
        ENTRYPOINT ["minio", "server", "/data", "--console-address", ":9001"]

    container_name: cinema_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data
    restart: unless-stopped

  minio-create-bucket:
    build:
      context: .
      dockerfile_inline: |
        FROM golang:alpine AS builder
        RUN apk add --no-cache git
        RUN go install github.com/minio/mc@latest
        
        FROM alpine:3.19
        RUN apk add --no-cache ca-certificates
        COPY --from=builder /go/bin/mc /usr/bin/mc
    container_name: cinema_minio_setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set myminio http://minio:9000 minioadmin minioadmin; do
        echo 'Waiting for minio to start...';
        sleep 3;
      done;
      mc mb myminio/cinema-booking --ignore-existing;
      mc anonymous set public myminio/cinema-booking;
      exit 0;
      "

volumes:
  mysql_data:
  redis_data:
  minio_data:
