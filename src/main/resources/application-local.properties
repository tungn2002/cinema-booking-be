# Local dev specific overrides

# db config
spring.datasource.url=jdbc:mysql://localhost:3306/moviereviewdbupdated?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

# jpa
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=redispass

# jwt config
jwt.secret=UqC2dkPJZQQQm0KyQcyl6IYx7P1GZgYHkGQFB8TnW+8QYoHpZi5p0AfXs1Oe5KIELHMjdnMhXzmW4AYxITXDOw==
jwt.expiration=3600000

# S3 Storage config (MinIO)
s3-client.endpoint=http://localhost:9000
s3-client.access-key-id=minioadmin
s3-client.secret-access-key=minioadmin
s3-client.bucket=cinema-booking
s3-client.region=us-east-1

# cors
spring.web.cors.allowed-origins=http://localhost:5173

# logging and debug
debug=true
logging.level.com.personal.cinemabooking=DEBUG
logging.level.org.springframework=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.boot=DEBUG

# stripe
stripe.api.key=sk_test_dummy_key
stripe.webhook.secret=whsec_dummy_secret

# paypal
paypal.client.id=paypal_dummy_client_id
paypal.client.secret=paypal_dummy_client_secret
paypal.mode=sandbox

# oauth2 google
spring.security.oauth2.client.registration.google.client-id=gg1
spring.security.oauth2.client.registration.google.client-secret=gg2

# email config
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@example.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
