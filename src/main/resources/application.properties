# main app props
spring.application.name=CinemaBookingApi
spring.profiles.active=local

# jpa stuff
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
springdoc.api-docs.path=/api-docs

# init database
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.data-locations=classpath:DB/data.sql


# file upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# cors settings for frontend (common)
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.web.cors.allowed-headers=Authorization,Content-Type,X-Requested-With,Accept,Origin,Access-Control-Request-Method,Access-Control-Request-Headers
spring.web.cors.exposed-headers=Authorization,Content-Type
spring.web.cors.allow-credentials=true
spring.web.cors.max-age=3600

# pdf receipt stuff
pdf.receipt.directory=receipts
app.name=CinemaBooking

# Reservation auto-cancel scheduler
reservation.expiration.minutes=15
reservation.scheduler.fixed-rate=60000