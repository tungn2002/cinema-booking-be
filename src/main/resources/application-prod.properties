# Production specific overrides using ENV variables

# db config
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# db init
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}

# jwt config
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}

# stripe
stripe.api.key=${STRIPE_API_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}

# paypal
paypal.client.id=${PAYPAL_CLIENT_ID}
paypal.client.secret=${PAYPAL_CLIENT_SECRET}
paypal.mode=${PAYPAL_MODE:sandbox}

# oauth2 google
spring.security.oauth2.client.registration.google.client-id=${CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${CLIENT_SECRET}

# S3 Storage config (MinIO)
s3-client.endpoint=${MINIO_ENDPOINT}
s3-client.access-key-id=${MINIO_ACCESS_KEY}
s3-client.secret-access-key=${MINIO_SECRET_KEY}
s3-client.bucket=${MINIO_BUCKET}
s3-client.region=${MINIO_REGION:us-east-1}
s3-client.public-url=${MINIO_PUBLIC_URL}

# email config
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# cors
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# logging
logging.level.root=INFO
logging.level.com.personal.cinemabooking=INFO