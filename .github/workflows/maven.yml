name: Deploy Backend to VPS

on:
  push:
    branches: [ "master", "main" ] # Hỗ trợ cả nhánh master hoặc main
  workflow_dispatch: # Cho phép bấm chạy bằng tay

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn -B package -Dmaven.test.skip=true --file pom.xml

    - name: Create Dockerfile
      run: |
        cat <<EOF > Dockerfile
        FROM eclipse-temurin:17-jdk-alpine
        WORKDIR /app
        COPY target/CinemaBookingApi-3.3.0.jar app.jar
        EXPOSE 8080
        ENTRYPOINT ["java", "-jar", "app.jar"]
        EOF

    - name: Generate .env file for VPS
      run: |
        cat <<EOF > .env
        CLIENT_ID=${{ secrets.CLIENT_ID }}
        CLIENT_SECRET=${{ secrets.CLIENT_SECRET }}
        DB_PASSWORD=${{ secrets.DB_PASSWORD }}
        JWT_SECRET=${{ secrets.JWT_SECRET }}
        MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
        MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
        PAYPAL_CLIENT_ID=${{ secrets.PAYPAL_CLIENT_ID }}
        PAYPAL_CLIENT_SECRET=${{ secrets.PAYPAL_CLIENT_SECRET }}
        PAYPAL_MODE=${{ secrets.PAYPAL_MODE }}
        REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
        STRIPE_API_KEY=${{ secrets.STRIPE_API_KEY }}
        STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
        EOF

    - name: Cleanup unnecessary files before copy
      run: rm -rf .git .github src

    - name: Copy Backend code to VPS
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: "."
        target: "/var/www/cinema-booking-be"
        strip_components: 1

    - name: Rebuild and Restart Docker on VPS
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd /var/www/cinema-booking-be
          
          # Đảm bảo tắt backend cũ nếu có thay đổi port hoặc volume
          docker-compose -f docker-compose-prod.yml stop backend || true
          
          # Khởi động lại toàn bộ hệ thống bằng lệnh up (nó sẽ tự động build lại backend nhờ file jar mới)
          docker-compose -f docker-compose-prod.yml up -d --build
          
          # Dọn dẹp rác Docker
          docker image prune -f